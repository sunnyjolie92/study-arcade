<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><title>Study Arcade</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f7ff}header{padding:22px 18px 8px}.sub{color:#aab5d6}.xp{background:#171f39;border:1px solid #2b375f;border-radius:14px;padding:12px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}.card,button,.choice{border:1px solid #33416d;background:#161e37;color:#fff;border-radius:18px;padding:16px;text-align:left;font-size:16px}.card{min-height:120px}.card b{display:block;font-size:18px;margin:8px 0}.emoji{font-size:28px}.screen{display:none;padding:16px}.screen.active{display:block}.home.active{display:block}.home{display:none}.back{margin-bottom:14px;padding:10px 14px}.panel{background:#121a31;border:1px solid #2b375f;border-radius:18px;padding:16px;margin:12px 0}.choices{display:grid;gap:10px}.choice:active,button:active{transform:scale(.98)}.good{border-color:#5dd39e}.bad{border-color:#ff8585}.hint{color:#ffd580}.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.selected{outline:3px solid #9ab3ff}.locked{opacity:.35}.status{font-weight:700;margin:12px 0}.ticket{border-left:4px solid #9ab3ff;padding-left:12px}.labmap{display:grid;grid-template-columns:1fr;gap:10px}.device{padding:14px;border:1px dashed #6675a8;border-radius:14px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{padding:10px}.small{font-size:13px;color:#aab5d6}select,input{font-size:16px;padding:10px;border-radius:12px;background:#11182c;color:white;border:1px solid #33416d;width:100%}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);max-width:950px;margin:auto}header,.screen{max-width:950px;margin:auto}}
</style></head><body><div id='home' class='home active'><header><h1>🎮 Study Arcade</h1><div class='sub'>Networking practice that makes you do the thinking.</div><div class='xp'>⭐ <span id='xp'>0</span> XP · <span id='weak'>No weak spots yet</span></div></header><main class='grid'>
<button class='card' onclick="show('practice')"><span class='emoji'>🧠</span><b>Smart Practice</b><span class='sub'>Recall, retry, explain.</span></button>
<button class='card' onclick="startMatch()"><span class='emoji'>🫧</span><b>Port Match</b><span class='sub'>Pair protocols with ports.</span></button>
<button class='card' onclick="startCase()"><span class='emoji'>🕵🏾‍♀️</span><b>Troubleshooting</b><span class='sub'>Investigate a network ticket.</span></button>
<button class='card' onclick="startLab()"><span class='emoji'>🛠️</span><b>Lab Practice</b><span class='sub'>Inspect → fix → verify.</span></button>
<button class='card' onclick="show('listen');loadListen()"><span class='emoji'>🎧</span><b>Listen Mode</b><span class='sub'>Eyes-free active recall.</span></button>
<button class='card' onclick="show('progress');renderProgress()"><span class='emoji'>📈</span><b>Progress</b><span class='sub'>See misses and mastery.</span></button></main></div>
<div id='practice' class='screen'><button class='back' onclick='goHome()'>← Arcade</button><h2>🧠 Smart Practice</h2><div id='qbox'></div></div>
<div id='match' class='screen'><button class='back' onclick='goHome()'>← Arcade</button><h2>🫧 Port Match</h2><p class='sub'>Pick one protocol and one port. A wrong pair won't give away the answer.</p><div id='matchStatus' class='status'></div><div id='pairs' class='pairgrid'></div></div>
<div id='case' class='screen'><button class='back' onclick='goHome()'>← Arcade</button><h2>🕵🏾‍♀️ Troubleshooting Case</h2><div id='casebox'></div></div>
<div id='lab' class='screen'><button class='back' onclick='goHome()'>← Arcade</button><h2>🛠️ Lab Practice</h2><div id='labbox'></div></div>
<div id='listen' class='screen'><button class='back' onclick='stopSpeech();goHome()'>← Arcade</button><h2>🎧 Listen Mode</h2><div class='panel'><label>Voice</label><select id='voices'></select><label>Speed</label><input id='rate' type='range' min='.75' max='1.35' value='1' step='.05'><div class='controls'><button onclick='speakQuestion()'>▶ Hear question</button><button onclick='stopSpeech()'>⏸ Stop</button><button onclick='speakHint()'>💡 Hint</button><button onclick='speakAnswer()'>✓ Reveal answer</button><button onclick='nextListen()'>Next →</button></div></div><div id='listenbox'></div></div>
<div id='progress' class='screen'><button class='back' onclick='goHome()'>← Arcade</button><h2>📈 Progress & Weak Spots</h2><div id='progressbox'></div></div>
<script>
const $ = (id) => document.getElementById(id);
const xpEl=$('xp'), weakEl=$('weak'), qbox=$('qbox'), matchStatus=$('matchStatus'), pairs=$('pairs'), casebox=$('casebox'), labbox=$('labbox'), voicesEl=$('voices'), rateEl=$('rate'), listenbox=$('listenbox'), progressbox=$('progressbox');
const qs=[
{t:'Fiber',q:'You need a fiber connector polish with the lowest back reflection for sensitive optical equipment. Which is best?',a:['PC','UPC','APC','SPC'],c:2,e:'APC uses an angled physical contact that sends reflected light away from the fiber core, giving very low back reflection.',h:'Think about which connector has an angled end face.'},
{t:'Tools',q:'Which tool terminates individual twisted-pair wires into IDC slots on a patch panel?',a:['Cable crimper','Punch-down tool','VFL','Loopback plug'],c:1,e:'A punch-down tool seats and trims individual conductors into IDC terminals. A crimper attaches modular plugs such as RJ45.',h:'Patch panels use IDC terminals, not a modular plug.'},
{t:'Fiber',q:'Which tool helps visually locate a fiber break or excessive bend?',a:['Tone generator','VFL','Cable crimper','Multimeter'],c:1,e:'A visual fault locator sends visible light through fiber; light escaping can reveal a break or severe bend.',h:'Its name literally includes “fault locator.”'},
{t:'Media',q:'For a 10 Gb connection only a few meters long within the same rack, which is usually the practical low-cost choice?',a:['Single-mode fiber','Cat 3','Twinax/DAC','RG-6'],c:2,e:'Direct Attach Copper (Twinax/DAC) is commonly useful for short, high-speed links such as same-rack connections.',h:'Look for a short direct-attach cable used between nearby network equipment.'},
{t:'Switching',q:'A switch receives a frame. What information does it primarily use to forward the frame inside a LAN?',a:['MAC address','DNS name','TCP port','URL'],c:0,e:'Ethernet switches learn and forward using MAC addresses at Layer 2.',h:'Think Layer 2.'},
{t:'Protocols',q:'You need secure remote command-line access to a Linux server. Which protocol should you use?',a:['Telnet','SSH','HTTP','TFTP'],c:1,e:'SSH provides encrypted remote shell access and commonly uses TCP port 22.',h:'It is the secure replacement for Telnet.'}
];
let data=JSON.parse(localStorage.getItem('saProgress')||'{"xp":0,"topics":{}}'); function save(){localStorage.setItem('saProgress',JSON.stringify(data));updateHeader()} function updateHeader(){xpEl.textContent=data.xp;let w=Object.entries(data.topics).sort((a,b)=>(b[1].miss||0)-(a[1].miss||0))[0];weakEl.textContent=w&&w[1].miss?'Weak spot: '+w[0]:'No weak spots yet'} updateHeader(); document.documentElement.dataset.appReady='true';
function show(id){document.querySelectorAll('.screen,.home').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='practice') loadQ()}function goHome(){show('home')}function mark(topic,ok){data.topics[topic]??={hit:0,miss:0};data.topics[topic][ok?'hit':'miss']++;if(ok)data.xp+=10;save()}
let qi=0,miss=0;function loadQ(){let q=qs[qi%qs.length];miss=0;qbox.innerHTML=`<div class='panel'><span class='small'>${q.t} · Exam Core</span><h3>${q.q}</h3><div class='choices'>${q.a.map((x,i)=>`<button class='choice' onclick='answer(${i})'>${x}</button>`).join('')}</div><div id='feedback'></div></div>`}function answer(i){let q=qs[qi%qs.length],f=$('feedback');if(i===q.c){mark(q.t,true);f.innerHTML=`<p class='good'>✅ Correct.</p><p>${q.e}</p><button onclick='qi++;loadQ()'>Next question →</button>`}else{miss++;mark(q.t,false);f.innerHTML=`<p class='bad'>❌ Not quite. Try again.</p>${miss>=2?`<p class='hint'>💡 ${q.h}</p>`:''}`}}
const ports=[['FTP Data','20'],['FTP Control','21'],['SSH','22'],['Telnet','23'],['SMTP','25'],['DNS','53'],['DHCP Server','67'],['DHCP Client','68'],['TFTP','69'],['HTTP','80'],['POP3','110'],['IMAP','143'],['HTTPS','443']];let sel=null,done=new Set();function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startMatch(){show('match');done=new Set();sel=null;let p=shuffle(ports).slice(0,6), cards=shuffle([...p.map(x=>({v:x[0],k:x[0],side:0})),...p.map(x=>({v:x[1],k:x[0],side:1}))]);pairs.innerHTML=cards.map((x,i)=>`<button id='m${i}' class='choice' data-k='${x.k}' data-side='${x.side}' onclick='pick(this)'>${x.v}</button>`).join('');matchStatus.textContent='0 / 6 pairs'}function pick(el){if(el.classList.contains('locked'))return;if(!sel){sel=el;el.classList.add('selected');return}if(sel===el){el.classList.remove('selected');sel=null;return}if(sel.dataset.side===el.dataset.side){sel.classList.remove('selected');sel=el;el.classList.add('selected');return}if(sel.dataset.k===el.dataset.k){sel.classList.add('locked');el.classList.add('locked');done.add(el.dataset.k);data.xp+=5;save();matchStatus.textContent=`${done.size} / 6 pairs`;if(done.size===6)matchStatus.innerHTML='🎉 Board cleared! <button onclick="startMatch()">Play again</button>'}else{matchStatus.textContent='Nope — those two do not pair. Try another combination.'}sel.classList.remove('selected');sel=null}
function startCase(){show('case');casebox.innerHTML=`<div class='panel ticket'><b>Ticket #1042</b><p>“My workstation says it is connected, and I can ping 8.8.8.8, but websites will not load by name.”</p></div><div class='panel'><b>Choose what to inspect first:</b><div class='choices'><button onclick="caseStep('ip')">IP address</button><button onclick="caseStep('dns')">DNS configuration</button><button onclick="caseStep('nic')">Replace the NIC</button><button onclick="caseStep('cable')">Replace Ethernet cable</button></div><div id='casefeedback'></div></div>`}function caseStep(x){if(x==='dns'){$('casefeedback').innerHTML=`<p>🔎 DNS server field is blank. The workstation can reach an IP address, so basic IP connectivity exists.</p><b>Diagnosis?</b><div class='choices'><button onclick='caseFix()'>Configure a valid DNS server</button><button onclick="$('casefeedback').innerHTML='<p>That would not explain successful IP connectivity. Keep investigating.</p>'">Replace the switch</button></div>`}else{$('casefeedback').innerHTML='<p>You can inspect that, but the strongest clue is that an IP address works while a hostname does not. What service translates names to IP addresses?</p>'}}function caseFix(){mark('DNS',true);$('casefeedback').innerHTML=`<p>✅ Fixed. Name resolution works again.</p><p><b>Why:</b> DNS translates hostnames into IP addresses. Being able to ping 8.8.8.8 showed that the network path was working; failing only by name pointed toward DNS.</p><button onclick='startCase()'>Restart case</button>`}
function startLab(){show('lab');labbox.innerHTML=`<div class='panel'><span class='small'>Physical Connectivity · Current</span><h3>Lab: Workstation has no link</h3><p>A workstation cannot reach the network. Follow the physical path before changing software settings.</p></div><div class='labmap'><button class='device' onclick="labInspect('pc')">🖥️ Workstation NIC<br><span class='small'>Inspect</span></button><button class='device' onclick="labInspect('cable')">〰️ Ethernet cable<br><span class='small'>Inspect</span></button><button class='device' onclick="labInspect('switch')">🔀 Switch Port 7<br><span class='small'>Inspect</span></button></div><div id='labfeedback' class='panel'>Select a component to inspect.</div>`}function labInspect(x){if(x==='pc')$('labfeedback').innerHTML='NIC is enabled. Link light: <b>OFF</b>. No obvious damage.';if(x==='cable')$('labfeedback').innerHTML='Cable is seated at the workstation. Follow it to the switch.';if(x==='switch')$('labfeedback').innerHTML=`Switch Port 7 link light: <b>OFF</b>. The cable is plugged into Port 8, while the documented active port is Port 7.<div class='choices'><button onclick='labFix()'>Move cable to Port 7</button><button onclick="$('labfeedback').innerHTML='<p>Replacing the NIC before correcting the obvious physical connection adds unnecessary work. Try the simplest likely fix first.</p>'">Replace NIC</button></div>`}function labFix(){mark('Troubleshooting',true);$('labfeedback').innerHTML='🟢 <b>Link light ON.</b> Connectivity restored.<p>The cable was connected to the wrong switch port. Physical-layer checks come before unnecessary component replacement.</p><button onclick="startLab()">Run lab again</button>'}
let li=0;function loadVoices(){let vs=window.speechSynthesis?.getVoices?.()||[],s=voicesEl;if(!s)return;s.innerHTML=vs.filter(v=>v.lang.startsWith('en')).map((v,i)=>`<option value='${vs.indexOf(v)}'>${v.name} (${v.lang})</option>`).join('')}if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,200)}function loadListen(){let q=qs[li%qs.length];listenbox.innerHTML=`<div class='panel'><span class='small'>${q.t}</span><h3>${q.q}</h3><p class='sub'>The answer stays hidden until you choose Reveal answer.</p></div>`}function say(t){if(!('speechSynthesis'in window))return alert('Speech synthesis is not available in this browser.');stopSpeech();let u=new SpeechSynthesisUtterance(t),vs=window.speechSynthesis.getVoices(),idx=+voicesEl.value;if(vs[idx])u.voice=vs[idx];u.rate=+rateEl.value;window.speechSynthesis.speak(u)}function speakQuestion(){let q=qs[li%qs.length];say('Alright, here is one for you. '+q.q+' Take a moment and think it through.')}function speakHint(){let q=qs[li%qs.length];say('Here is your clue. '+q.h)}function speakAnswer(){let q=qs[li%qs.length];say('The answer is '+q.a[q.c]+'. '+q.e)}function stopSpeech(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}function nextListen(){li++;loadListen();speakQuestion()}
function renderProgress(){let entries=Object.entries(data.topics);progressbox.innerHTML=`<div class='panel'><h3>${data.xp} XP</h3><p class='sub'>XP is just a progress marker. Misses are used to decide what needs more practice.</p></div>`+(entries.length?entries.map(([t,v])=>`<div class='panel'><b>${t}</b><p>Correct: ${v.hit} · Missed: ${v.miss}</p></div>`).join(''):`<div class='panel'>Play a few activities and your topic history will appear here.</div>`)}
</script></body></html>
